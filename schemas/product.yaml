components:
  schemas:
    Product:
      type: object
      description: A product the workspace can see, with its enabled state and configured roles.
      properties:
        name:
          type: string
          example: "Cal"
        enabled:
          type: boolean
          description: Whether the product is currently enabled for the workspace.
          example: true
        roles:
          type: array
          items:
            type: string
          example: ["Admin", "Standard"]

    ProductListResponse:
      allOf:
        - $ref: "../schemas/common.yaml#/components/schemas/PaginatedResponse"
        - type: object
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/Product"
