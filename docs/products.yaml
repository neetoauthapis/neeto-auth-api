openapi: 3.0.3
info:
  title: NeetoAuth APIs
  version: 1.0.0

servers:
  $ref: "../schemas/common.yaml#/servers"

paths:
  /products:
    get:
      summary: List products
      description: >-
        Lists the products the workspace can see, enabled or not, together with
        the roles each one exposes. Use the enabled field to tell them apart.
        Products the workspace is not shown, such as ones still in private
        production, are left out.
      parameters:
        - $ref: "../schemas/common.yaml#/api_key_header"
        - $ref: "../schemas/common.yaml#/page_number_param"
        - $ref: "../schemas/common.yaml#/page_size_param"
      responses:
        "200":
          description: OK - Request succeeded
          content:
            application/json:
              schema:
                $ref: "../schemas/product.yaml#/components/schemas/ProductListResponse"
